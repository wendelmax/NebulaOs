# NebulaOS Bare Metal PXE Configuration (dnsmasq)

# Interface to listen on
interface=eth0
bind-dynamic

# DHCP Range (adjust to your network)
dhcp-range=192.168.100.50,192.168.100.150,255.255.255.0,1h

# PXE Boot Options
enable-tftp
tftp-root=/var/lib/tftpboot

# Serve iPXE to standard PXE clients
dhcp-match=set:ipxe,175
dhcp-boot=tag:!ipxe,undionly.kpxe
dhcp-boot=tag:ipxe,http://nebula-api.nebula.local:8000/api/baremetal/boot.ipxe

# DNS (Nebula Internal)
address=/nebula.local/192.168.100.10
address=/api.nebula.local/192.168.100.10
