services:
  postgres:
    image: postgres:16-alpine
    container_name: nebula-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nebula}
      POSTGRES_USER: ${POSTGRES_USER:-nebula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../src/api/internal/infrastructure/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nebula}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: nebula-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KC_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    image: hashicorp/vault:1.15
    container_name: nebula-vault
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"

  traefik:
    image: traefik:v2.10
    container_name: nebula-traefik
    user: root
    command:
      - "--log.level=${TRAEFIK_LOG_LEVEL:-DEBUG}"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:${TRAEFIK_ENTRYPOINT_PORT:-80}"
      - "--providers.file.filename=/etc/traefik/traefik_dynamic.yml"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik_access.log"
    volumes:
      - "./traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yml:ro"
    ports:
      - "${TRAEFIK_ENTRYPOINT_PORT:-80}:${TRAEFIK_ENTRYPOINT_PORT:-80}"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    env_file:
      - ../../.env

  localstack:
    image: localstack/localstack
    container_name: nebula-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=ec2,s3
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  nebula-api:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
    container_name: nebula-api
    ports:
      - "${NEBULA_API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-nebula}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-nebula}?sslmode=disable
      - NATS_URL=nats://nats:${NATS_PORT:-4222}
      - KC_URL=http://keycloak:${KC_PORT:-8080}
      - VAULT_URL=http://vault:${VAULT_PORT:-8200}
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID:-root}
      - JWT_SECRET=${JWT_SECRET:-nebula-secret-key-2026}
      - PORT=${NEBULA_API_PORT:-8000}
      - HOST=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      vault:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:${NEBULA_API_PORT:-8000}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${NEBULA_API_DOMAIN:-api.nebula.local}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=${NEBULA_API_PORT:-8000}"
    env_file:
      - ../../.env

  nebula-dashboard:
    build:
      context: ../../src/dashboard
      dockerfile: Dockerfile
    container_name: nebula-dashboard
    depends_on:
      - nebula-api
    environment:
      VITE_API_URL: http://nebula-api:${NEBULA_API_PORT:-8000}
      VITE_AUTH_STORAGE_KEY: ${VITE_AUTH_STORAGE_KEY:-nebula_token}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${NEBULA_DOMAIN:-nebula.local}`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.services.dashboard.loadbalancer.server.port=${NEBULA_DASHBOARD_PORT:-80}"

volumes:
  postgres_data:
