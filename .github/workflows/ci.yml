name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./src/api/... ./src/providers/... ./src/cli/...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - run: npm ci
        working-directory: src/dashboard

      - run: npm run lint
        working-directory: src/dashboard

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: go build -o /dev/null ./src/api/cmd/server/
        working-directory: .

      - run: go vet ./src/api/... ./src/providers/... ./src/cli/...

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: go build -o /dev/null ./src/cli/cmd/nebula/
        working-directory: .

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - run: npm ci
        working-directory: src/dashboard

      - run: npm run build
        working-directory: src/dashboard

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: go test ./...
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - run: npm ci
        working-directory: src/dashboard

      - run: npm run test
        working-directory: src/dashboard

  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t nebula-api -f src/api/Dockerfile .

      - run: docker build -t nebula-dashboard -f src/dashboard/Dockerfile .
